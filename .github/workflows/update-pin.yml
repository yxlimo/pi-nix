name: Update pin

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-pin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Track the latest upstream release
        id: upstream
        run: |
          set -euo pipefail
          read_rev() {
            nix flake metadata --json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["locks"]["nodes"]["pi-src"]["locked"]["rev"])'
          }
          before="$(read_rev)"
          nix flake update pi-src
          after="$(read_rev)"
          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "after=${after}" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pi-src: ${before} -> ${after}"
          fi

      - name: Refresh the model catalog pin
        id: pin
        run: |
          set -euo pipefail
          before="$(python3 -c 'import json;print(json.load(open("packages/pi-model-catalog.json"))["revision"])' 2>/dev/null || echo none)"
          python3 scripts/update-pin.py
          after="$(python3 -c 'import json;print(json.load(open("packages/pi-model-catalog.json"))["revision"])')"
          echo "revision=${after}" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: nix build -L .#pi --no-link

      - name: Smoke-test
        run: |
          out="$(nix build --no-link --print-out-paths .#pi)"
          "$out/bin/pi" --version
          "$out/bin/pi" --help > /dev/null

      - name: Commit
        if: |
          steps.upstream.outputs.changed == 'true' || steps.pin.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock packages/pi-model-catalog.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: pi ${UPSTREAM_BEFORE:0:8} -> ${UPSTREAM_AFTER:0:8}, catalog ${PIN_REV:0:16}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          exit 1
        env:
          UPSTREAM_BEFORE: ${{ steps.upstream.outputs.before }}
          UPSTREAM_AFTER: ${{ steps.upstream.outputs.after }}
          PIN_REV: ${{ steps.pin.outputs.revision }}
