name: Update

# Mirrors upstream releases. When upstream tags a version, this workflow
# advances the pi-src input to that tag, refreshes the model-catalog pin and the
# npm artifact, builds and smoke-tests both packages, commits, then publishes a
# tag and a GitHub release for the built version.
#
# 触发方式（**没有 cron**）：
#   · repository_dispatch（type=upstream-release）：由外部中继在 earendil-works/pi
#     发版后触发（GitHub 不会把别人仓的 release 事件投递给本仓）；
#   · workflow_dispatch：手动补跑，可指定 tag。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag to build (blank = newest)"
        required: false
        default: ""
  repository_dispatch:
    types: [ upstream-release ]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag step runs even when nothing changed, and it needs an identity.
      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve the upstream tag
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.ref }}
          # 中继（Oracle 上的 gh-release-relay）dispatch 时带的版本号，
          # 形如 1.5.0（已去掉前导 v）；这里是另一种入口，优先用它。
          DISPATCHED: ${{ github.event.client_payload.version }}
        run: |
          set -euo pipefail
          latest="${REQUESTED:-}"
          if [ -z "$latest" ] && [ -n "${DISPATCHED:-}" ]; then
            latest="v${DISPATCHED#v}"
          fi
          if [ -z "$latest" ]; then
            latest="$(gh api repos/earendil-works/pi/tags --jq '.[0].name')"
          fi
          current="$(grep -oP '(?<=refs/tags/)[^"]+' flake.nix | head -1)"
          echo "tag=${latest}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          if [ "$latest" = "$current" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pi-src already at ${current}"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pi-src: ${current} -> ${latest}"
          fi

      - name: Point pi-src at that tag
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -euo pipefail
          old="${{ steps.upstream.outputs.current }}"
          new="${{ steps.upstream.outputs.tag }}"
          sed -i "s|earendil-works/pi?ref=refs/tags/${old//./\\.}|earendil-works/pi?ref=refs/tags/${new}|" flake.nix
          grep -n "pi-src.url" flake.nix
          nix flake update pi-src

      - name: Refresh the model catalog pin
        id: pin
        run: |
          set -euo pipefail
          before="$(python3 -c 'import json;print(json.load(open("packages/pi-model-catalog.json"))["revision"])' 2>/dev/null || echo none)"
          python3 scripts/update-pin.py
          after="$(python3 -c 'import json;print(json.load(open("packages/pi-model-catalog.json"))["revision"])')"
          echo "revision=${after}" >> "$GITHUB_OUTPUT"
          if [ "$before" = "$after" ]; then echo "changed=false" >> "$GITHUB_OUTPUT";
          else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # Keyed on the upstream tag rather than on "did it move this run": the
      # artifact has to match pi-src, whichever way we got there.
      - name: Refresh the npm artifact
        id: npm
        run: |
          set -euo pipefail
          tag="${{ steps.upstream.outputs.tag }}"
          version="${tag#v}"
          before="$(python3 -c 'import re,sys;print(re.search(r"version = \"([^\"]+)\"", open("packages/pi-npm.nix").read()).group(1))')"
          python3 scripts/update-npm-artifact.py "${version}"
          after="$(python3 -c 'import re,sys;print(re.search(r"version = \"([^\"]+)\"", open("packages/pi-npm.nix").read()).group(1))')"
          echo "version=${after}" >> "$GITHUB_OUTPUT"
          if [ "${before}" = "${after}" ]; then echo "changed=false" >> "$GITHUB_OUTPUT";
          else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build the source package
        run: nix build -L .#pi --no-link

      - name: Build the npm package
        run: nix build -L .#pi-npm --no-link

      - name: Smoke-test both
        id: smoke
        run: |
          set -euo pipefail
          source_version=""
          for attr in pi pi-npm; do
            out="$(nix build --no-link --print-out-paths ".#${attr}")"
            version="$("$out/bin/pi" --version)"
            "$out/bin/pi" --help > /dev/null
            echo "${attr} -> pi ${version}"
            if [ "${attr}" = "pi" ]; then source_version="${version}"; fi
          done
          echo "version=${source_version}" >> "$GITHUB_OUTPUT"

      - name: Verify both packages match the upstream tag
        run: |
          set -euo pipefail
          want="${{ steps.upstream.outputs.tag }}"
          for attr in pi pi-npm; do
            out="$(nix build --no-link --print-out-paths ".#${attr}")"
            got="$("$out/bin/pi" --version)"
            if [ "v${got}" != "${want}" ]; then
              echo "::error::${attr} built pi ${got} but the upstream tag is ${want}"
              exit 1
            fi
            echo "${attr}: ${got} matches ${want}"
          done

      - name: Verify the flake pins the tag we built
        run: |
          set -euo pipefail
          want="${{ steps.upstream.outputs.tag }}"
          grep -F "refs/tags/${want}\"" flake.nix ||
            { echo "::error::flake.nix does not pin ${want}"; exit 1; }

      - name: Commit
        if: |
          steps.upstream.outputs.changed == 'true' ||
          steps.pin.outputs.changed == 'true' ||
          steps.npm.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add flake.nix flake.lock packages/pi-model-catalog.json \
            packages/pi-npm.nix npm/package.json npm/package-lock.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: pi ${{ steps.smoke.outputs.version }}, catalog ${{ steps.pin.outputs.revision }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          exit 1

      - name: Publish tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ steps.smoke.outputs.version }}"
          git fetch --tags --force origin > /dev/null 2>&1 || true

          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "tag ${tag} already exists"
          else
            git tag -a "${tag}" -m "pi ${tag}"
            git push origin "${tag}"
          fi

          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "release ${tag} already exists"
            exit 0
          fi

          notes="${RUNNER_TEMP}/release-notes.md"
          {
            echo "pi ${tag}, built twice from the same upstream release."
            echo
            echo "| Attribute | Installs |"
            echo "|---|---|"
            echo "| \`packages.<system>.pi-npm\` | prebuilt npm tarball |"
            echo "| \`packages.<system>.pi\` | built from source |"
            echo
            echo '```nix'
            echo "inputs.pi-nix.url = \"github:yxlimo/pi-nix/${tag}\";"
            echo '```'
            echo
            echo "- upstream tag: ${tag}"
            echo "- model catalog pin: \`${{ steps.pin.outputs.revision }}\`"
          } > "${notes}"

          gh release create "${tag}" --title "pi ${tag}" --notes-file "${notes}"
